<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1524" />
      <stop offset="100%" stop-color="#540810" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield / Circle -->
  <circle cx="120" cy="120" r="110" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Inner Crest Gear & Atom Symbol -->
  <!-- Gear Ring -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <circle cx="120" cy="120" r="45" fill="#FFFFFF"/>
    <!-- Atom orbits -->
    <ellipse cx="120" cy="120" rx="40" ry="16" fill="none" stroke="#8B1524" stroke-width="3" transform="rotate(30 120 120)"/>
    <ellipse cx="120" cy="120" rx="40" ry="16" fill="none" stroke="#8B1524" stroke-width="3" transform="rotate(90 120 120)"/>
    <ellipse cx="120" cy="120" rx="40" ry="16" fill="none" stroke="#8B1524" stroke-width="3" transform="rotate(150 120 120)"/>
    <circle cx="120" cy="120" r="7" fill="#8B1524"/>
  </g>

  <!-- Open Book Base -->
  <path d="M75 160 Q120 148 120 168 Q120 148 165 160 L165 178 Q120 166 120 186 Q120 166 75 178 Z" fill="url(#goldGrad)" stroke="#540810" stroke-width="1.5"/>

  <!-- Header & Footer Text Arc Mock -->
  <text x="120" y="44" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">NFC - IET</text>
  <text x="120" y="60" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1.2">INSTITUTE OF ENGG. &amp; TECH</text>
  <text x="120" y="208" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">MULTAN, PAKISTAN</text>
</svg>
